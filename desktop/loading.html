<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>Pixfun</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:#151819;color:#e9ebe8;font:14px -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}.titlebar{position:absolute;inset:0 0 auto;height:46px;-webkit-app-region:drag}.ambient{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 42% 48% at 50% 41%,#d7b58109,transparent 80%)}.guide{position:absolute;left:8%;right:8%;top:50%;height:1px;background:linear-gradient(90deg,transparent,#d7b5810c 20%,transparent 40%,transparent 60%,#d7b5810c 80%,transparent)}main{height:100%;display:flex;align-items:center;justify-content:center;position:relative;padding-bottom:46px}.brand{display:flex;flex-direction:column;align-items:center;text-align:center}.app-icon{width:140px;height:140px;display:block;margin-bottom:12px}h1{margin:0;font-size:43px;line-height:1.16;letter-spacing:-1.6px;font-weight:650}.promise{font-size:15px;line-height:1.6;color:#aeb7b8;margin:15px 0 0;letter-spacing:.1px}.loading{display:flex;align-items:center;gap:9px;margin-top:45px;min-height:20px;color:#9da7aa;font-size:12px}.spinner{width:12px;height:12px;border:1.5px solid #d7b58125;border-top-color:#d7b581;border-radius:50%;animation:spin 1s linear infinite}footer{position:absolute;bottom:30px;inset-inline:34px;display:flex;justify-content:space-between;align-items:center;color:#7f8a8f;font-size:11px;letter-spacing:.2px}.local{display:flex;align-items:center;gap:6px}.local svg{width:12px;height:12px;opacity:.85}@keyframes spin{to{transform:rotate(360deg)}}@keyframes arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.brand{animation:arrive .35s ease-out both}@media(prefers-reduced-motion:reduce){.spinner,.brand{animation:none}}@media(max-height:550px){.app-icon{width:106px;height:106px}.loading{margin-top:25px}}
</style><script src="loading.js" defer></script></head>
<body><div class="titlebar"></div><div class="ambient"></div><div class="guide"></div><main><section class="brand" aria-label="Pixfun is starting"><img class="app-icon" src="icon.svg" alt=""><h1>Pixfun</h1><p class="promise">Every journey has a story.</p><div class="loading" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="startupStatus">Starting your workspace…</span></div></section></main><footer><span class="local"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="5" y="9" width="10" height="8" rx="2"/><path d="M7 9V6a3 3 0 0 1 6 0v3"/></svg>Your footage stays on your Mac</span><span>Pixfun for Mac</span></footer></body></html>
