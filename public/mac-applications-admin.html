<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>申请管理 — Pixfun</title><link rel="icon" href="/assets/images/pixfun-icon-v2.png"><link rel="stylesheet" href="/assets/palette.css?v=workspace-2"><link rel="stylesheet" href="/assets/mac-early-access.css?v=2"><link rel="stylesheet" href="/assets/mac-applications-admin.css?v=1"><script src="/assets/mac-applications-admin.js?v=1" defer></script></head>
<body class="application-page admin-page"><header class="application-header"><a href="/" aria-label="Pixfun home"><img src="/assets/images/pixfun-icon-v2.png" alt="" width="32" height="32"><strong>Pixfun</strong></a><span class="local-badge">仅本机管理</span></header>
<main class="admin-main"><header class="admin-heading"><div><p class="development-label">MAC EARLY ACCESS</p><h1>申请管理</h1><p>集中查看创作者背景、需求和订阅意愿。</p></div><button id="refreshApplications" type="button">刷新</button></header>
<p id="adminStatus" role="status">正在读取申请…</p>
<section id="adminContent" hidden aria-label="申请汇总"><div class="admin-metrics"><div><span>全部申请</span><strong id="totalApplications">0</strong></div><div><span>最近 7 天</span><strong id="recentApplications">0</strong></div><div><span>愿意付费</span><strong id="paidApplications">0</strong></div></div>
<section class="budget-summary" aria-labelledby="budgetTitle"><h2 id="budgetTitle">月订阅意愿 <small>全部申请 · USD</small></h2><div id="budgetDistribution" class="budget-distribution"></div></section>
<div class="admin-tools"><label class="search-field"><span class="sr-only">搜索邮箱或需求</span><input id="applicationSearch" type="search" placeholder="搜索邮箱、需求或平台"></label><label><span class="sr-only">身份筛选</span><select id="backgroundFilter"><option value="all">全部背景</option><option value="enthusiast">旅游爱好者</option><option value="creator">平台创作者</option><option value="editor">独立导演 / 剪辑师</option><option value="studio">工作室 / 制作团队</option><option value="brand">品牌 / 营销团队</option><option value="other">其他</option><option value="legacy">历史申请（未填背景）</option></select></label><label><span class="sr-only">预算筛选</span><select id="budgetFilter"><option value="all">全部预算</option><option value="free">仅免费</option><option value="1-9">$1–9</option><option value="10-19">$10–19</option><option value="20-39">$20–39</option><option value="40-69">$40–69</option><option value="70+">$70+</option><option value="unsure">暂不确定</option></select></label><button id="exportApplications" type="button" disabled>导出 CSV</button></div>
<div class="list-heading"><h2>申请列表</h2><span id="applicationCount" role="status"></span></div><div class="table-scroll"><table><thead><tr><th scope="col">邮箱 / 提交时间</th><th scope="col">个人背景</th><th scope="col">月预算</th><th scope="col">创作需求</th></tr></thead><tbody id="applicationRows"></tbody></table></div><p id="applicationEmpty" class="empty-state" hidden>还没有申请。问卷提交后会自动汇总到这里。</p></section>
<p class="admin-note">含个人联系方式，请勿公开转发。导出仅包含当前筛选结果；不会自动发送邮件。</p></main></body></html>
